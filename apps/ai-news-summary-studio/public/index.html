<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI News & Summary Video Studio</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;background:#0f1115;color:#eee}textarea{width:100%;min-height:220px;background:#171a21;color:#fff;border:1px solid #333;border-radius:10px;padding:14px;box-sizing:border-box}button{padding:12px 18px;border:0;border-radius:9px;margin-top:12px;cursor:pointer}pre{white-space:pre-wrap;background:#171a21;padding:16px;border-radius:10px;margin-top:18px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#252a34}</style></head><body><h1>AI News & Summary Video Studio</h1><p><span class="badge">V1 — Storyboard 60 detik</span></p><p>Masukkan bahan berita. Tahap pertama hanya membuat storyboard; video belum digenerate.</p><textarea id="text" placeholder="Tempel teks berita atau rangkuman di sini..."></textarea><br><button onclick="make()">Buat Storyboard</button><pre id="out">Menunggu bahan berita...</pre><script>async function make(){const text=document.getElementById('text').value.trim();if(!text)return;const out=document.getElementById('out');out.textContent='Memproses...';try{const r=await fetch('/api/storyboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent='Gagal: '+e.message}}</script></body></html>

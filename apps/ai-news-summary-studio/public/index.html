<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI News & Summary Video Studio</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;background:#0f1115;color:#eee}textarea{width:100%;min-height:220px;background:#171a21;color:#fff;border:1px solid #333;border-radius:10px;padding:14px;box-sizing:border-box}button{padding:12px 18px;border:0;border-radius:9px;margin:8px 8px 0 0;cursor:pointer}pre{white-space:pre-wrap;background:#171a21;padding:16px;border-radius:10px;margin-top:18px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#252a34}a{color:#8ab4ff;font-weight:700}</style></head><body><h1>AI News & Summary Video Studio</h1><p><span class="badge">V1.2 — Storyboard → MP4</span></p><p>Tempel bahan berita. Buat storyboard, lalu render video vertikal 60 detik. Versi ini membuat MP4 visual dasar; TTS Indonesia masuk setelah OpenRouter dipasang.</p><textarea id="text" placeholder="Tempel teks berita atau rangkuman di sini..."></textarea><br><button onclick="make()">1. Buat Storyboard</button><button id="renderBtn" onclick="render()" disabled>2. Render MP4</button><pre id="out">Menunggu bahan berita...</pre><div id="download"></div><script>let storyboard=null;async function make(){const text=document.getElementById('text').value.trim();if(!text)return;const out=document.getElementById('out');out.textContent='Memproses storyboard...';document.getElementById('renderBtn').disabled=true;document.getElementById('download').innerHTML='';try{const r=await fetch('/api/storyboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Gagal');storyboard=data;out.textContent=JSON.stringify(data,null,2);document.getElementById('renderBtn').disabled=!data.scenes?.length}catch(e){out.textContent='Gagal: '+e.message}}async function render(){if(!storyboard)return;const out=document.getElementById('out');out.textContent='Merender MP4...';document.getElementById('renderBtn').disabled=true;try{const r=await fetch('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({storyboard})});const data=await r.json();if(!r.ok)throw new Error(data.error+(data.detail?' — '+data.detail:''));out.textContent=JSON.stringify(data,null,2);document.getElementById('download').innerHTML='<p><a href="'+data.download+'" target="_blank">▶ Buka / simpan MP4 hasil render</a></p>'}catch(e){out.textContent='Gagal render: '+e.message;document.getElementById('renderBtn').disabled=false}}</script></body></html>
